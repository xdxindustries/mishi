AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Mishi Bao Gacha Game Backend

Globals:
  Function:
    Runtime: nodejs20.x
    MemorySize: 256
    Timeout: 10
    Architectures:
      - arm64

Resources:
  MishiTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-table'
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  MishiApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - 'https://demo.tuck.family'
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 3600

  MishiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers/router.handler
      CodeUri: dist/
      Environment:
        Variables:
          TABLE_NAME: !Ref MishiTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MishiTable
      Events:
        GetPlayer:
          Type: HttpApi
          Properties:
            ApiId: !Ref MishiApi
            Path: /player/{username}
            Method: GET
        CreatePlayer:
          Type: HttpApi
          Properties:
            ApiId: !Ref MishiApi
            Path: /player
            Method: POST
        Pull:
          Type: HttpApi
          Properties:
            ApiId: !Ref MishiApi
            Path: /pull
            Method: POST
        Upgrade:
          Type: HttpApi
          Properties:
            ApiId: !Ref MishiApi
            Path: /upgrade
            Method: POST

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${MishiApi}.execute-api.${AWS::Region}.amazonaws.com'
  TableName:
    Description: DynamoDB table name
    Value: !Ref MishiTable
